name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias de desarrollo
        run: uv sync --locked --python 3.13
      - name: Lint de skills y manifiestos
        run: uv run python tools/lint_skills.py
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pytest
        run: uv run --locked --python ${{ matrix.python }} pytest
